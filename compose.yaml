name: fsp-platform
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_local_change_me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8025:8025"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://fsp:${POSTGRES_PASSWORD:-fsp_local_change_me}@postgres:5432/fsp?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DEMO_SEED: ${DEMO_SEED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-platform@fsp.local}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
