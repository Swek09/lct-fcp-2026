server {
    listen 80;
    listen [::]:80;
    server_name fsp.swek.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/fsp-career/acme;
        default_type text/plain;
    }
    location / { return 301 https://fsp.swek.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fsp.swek.tech;

    ssl_certificate /etc/letsencrypt/live/fsp.swek.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fsp.swek.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/fsp-career.access.log;
    error_log /var/log/nginx/fsp-career.error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 40s;
    }
}
