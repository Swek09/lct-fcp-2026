# Installed on the host by an administrator. CI supplies only revision-tagged images.
name: fsp-career

x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: '3'

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.35
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=50]
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fsp -d fsp]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.1
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.1
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
    volumes:
      - mailpit-data:/data
    # Demo mail is private; an administrator can access it through an SSH tunnel.
    ports:
      - 127.0.0.1:18025:8025
    logging: *logging

  api:
    image: fsp-career-api:${FSP_REVISION:?Supply the tested commit SHA}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    environment:
      DATABASE_URL: postgres://fsp:${POSTGRES_PASSWORD}@postgres:5432/fsp?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-demo}
      APP_URL: https://fsp.swek.tech
      DEMO_SEED: ${DEMO_SEED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-platform@fsp.swek.tech}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: '1'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8000/api/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    logging: *logging

  web:
    image: fsp-career-web:${FSP_REVISION:?Supply the tested commit SHA}
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.15
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
      - /tmp:size=8m,noexec,nosuid
    ports:
      - 127.0.0.1:18080:80
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/api/health]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
